# ==============================================================================
# QUALITY GATES
# ==============================================================================
name: Quality Gates

# ==============================================================================
# TRIGGERS
# ==============================================================================
on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    schedule:
        -   cron: 0 3 * * 1
    workflow_dispatch:

# ==============================================================================
# CONCURRENCY
# ==============================================================================
# The event name keeps scheduled and manual runs out of the push group, so a
# merge to master cannot cancel one part way through.
concurrency:
    group: quality-gates-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: read

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: GATES
    # ==========================================================================
    # Knip, bundle size, and mutation (scoped on PRs, full on schedule) - all
    # from the shared reusable workflow.
    gates:
        uses: sinemacula/.github/.github/workflows/node-quality-gates.yml@v3.2.0
        # The shared jobs inherit only what this job grants.
        permissions:
            contents: read
            packages: read

    # ==========================================================================
    # JOB: STRUCTURE
    # ==========================================================================
    # Repo-specific: dogfood the web-core eslint preset. Consumers get the
    # preset through qlty, so this job does not belong in the shared workflow.
    structure:
        name: Structure lint
        if: ${{ github.event_name != 'schedule' }}
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            # The preset rule tests and mutation gate only need to run when the
            # preset itself, or a dependency that could change rule behaviour,
            # changes. The structure lint validates all source and runs always.
            -   name: Detect preset changes
                id: changes
                uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
                with:
                    filters: |
                        preset:
                            - 'eslint/**'
                            - 'eslint.structure.mjs'
                            - 'stryker.eslint.config.json'
                            - 'package.json'
                            - 'package-lock.json'

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: '26'
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Preset unit tests
                if: ${{ steps.changes.outputs.preset == 'true' || github.event_name == 'workflow_dispatch' }}
                run: npm run test:eslint

            -   name: Preset mutation gate
                if: ${{ steps.changes.outputs.preset == 'true' || github.event_name == 'workflow_dispatch' }}
                run: npm run test:mutation:eslint

            -   name: Structure lint
                run: npm run lint:structure

            -   name: Script unit tests
                run: npm run test:scripts

    # ==========================================================================
    # JOB: PACKAGE
    # ==========================================================================
    # Repo-specific: every other job resolves kernel imports to `src`, so this
    # one checks the packed tarball itself, then installs it into a clean
    # consumer that typechecks, lints, builds and boots it.
    package:
        name: Package
        if: ${{ github.event_name != 'schedule' }}
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: '26'
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Check the packed exports and types
                run: npm run check:pkg

            -   name: Install Playwright browsers
                run: npx playwright install --with-deps chromium

            -   name: Consumer smoke test
                run: npm run test:consumer
