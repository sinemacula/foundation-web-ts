name: Quality Gates

on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    schedule:
        -   cron: 0 3 * * 1
    workflow_dispatch:

# The event name keeps scheduled and manual runs out of the push group, so a
# merge to master cannot cancel one part way through.
concurrency:
    group: quality-gates-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

permissions:
    contents: read

defaults:
    run:
        shell: bash

jobs:
    # Knip, bundle size and mutation (scoped on PRs, full on schedule).
    gates:
        uses: sinemacula/.github/.github/workflows/node-quality-gates.yml@v3.0.2
        # The shared jobs inherit only what this job grants.
        permissions:
            contents: read
            packages: read

    # Dogfoods this repo's eslint preset; not part of the shared workflow.
    structure:
        name: Structure lint
        if: ${{ github.event_name != 'schedule' }}
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            # Preset tests and mutation run only when the preset or deps change.
            -   name: Detect preset changes
                id: changes
                uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
                with:
                    filters: |
                        preset:
                            - 'eslint/**'
                            - 'eslint.structure.mjs'
                            - 'stryker.eslint.config.json'
                            - 'package.json'
                            - 'package-lock.json'

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: '26'
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Preset unit tests
                if: ${{ steps.changes.outputs.preset == 'true' || github.event_name == 'workflow_dispatch' }}
                run: npm run test:eslint

            -   name: Preset mutation gate
                if: ${{ steps.changes.outputs.preset == 'true' || github.event_name == 'workflow_dispatch' }}
                run: npm run test:mutation:eslint

            -   name: Structure lint
                run: npm run lint:structure
