# ==============================================================================
# TESTS
# ==============================================================================
name: Tests

# ==============================================================================
# TRIGGERS
# ==============================================================================
on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    workflow_dispatch:

# ==============================================================================
# CONCURRENCY
# ==============================================================================
concurrency:
    group: tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:

    # ==========================================================================
    # JOB: TESTS
    # ==========================================================================
    # Typecheck, unit tests at 100% coverage across the Node matrix, the build,
    # and the Playwright e2e suite - all from the shared reusable workflow.
    tests:
        uses: sinemacula/.github/.github/workflows/node-tests.yml@v3.2.0
        # The shared jobs inherit only what this job grants; the coverage upload
        # signs in through OIDC.
        permissions:
            contents: read
            id-token: write

    # ==========================================================================
    # JOB: END-TO-END (FIREFOX AND WEBKIT)
    # ==========================================================================
    # Repo-specific: the shared e2e job installs only Chromium, so the `@engine`
    # specs run on Firefox and WebKit here against the same preview build.
    engines:
        name: End-to-end (Firefox, WebKit)
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v7
                with:
                    node-version: '26'
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Install Playwright browsers
                run: npx playwright install --with-deps firefox webkit

            -   name: End-to-end tests
                run: npm run test:e2e:engines

            -   name: Upload Playwright report
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: playwright-report-engines
                    path: build/playwright-report/
                    retention-days: 14
