<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Reference application for the Sine Macula Foundation Web framework." />
        <meta name="theme-color" content="#f8fafc" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>Foundation Web</title>
        <script>
            (function(){var t=null;try{t=localStorage.getItem("theme")}catch(e){}if(t!=='light'&&t!=='dark'&&t!=='system'){t="system"}if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t)}})()
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
