# Reference: https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/*.d.ts",
    "**/build/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    "playground/public/**",
    ".sinemacula/**",
]

test_patterns = [
    "**/test/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.30.1"

[runtimes.enabled]
node = "24.18.0"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "yamllint"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "actionlint"

[[plugin]]
name = "editorconfig-checker"

[[plugin]]
name = "shfmt"
mode = "comment"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "trivy"
drivers = [
    "config",
    "fs-vuln",
]

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "biome"
version = "2.5.6"
mode = "comment"

# package_filters carries the shared config and its peers into the eslint
# sandbox, which otherwise installs only eslint/jest/prettier.
[plugins.definitions.eslint]
config_files = [".qlty/configs/eslint.config.mjs"]

[[plugin]]
name = "eslint"
mode = "comment"
package_file = ".qlty/configs/eslint/package.json"
package_filters = ["eslint", "typescript", "typescript-eslint", "@typescript-eslint", "eslint-plugin-jsdoc", "eslint-plugin-vue", "eslint-plugin-check-file", "vue-eslint-parser", "yaml-eslint-parser", "@sinemacula/coding-standards"]

# Keeps eslint off its own config file.
[[exclude]]
plugins = ["eslint"]
file_patterns = [".qlty/**"]

# Knip runs as a CI gate (`npm run deadcode`), not here: qlty stages a default
# knip.json that outranks knip.ts, whose Vue compiler JSON cannot express.

# qlty Cloud checks out without node_modules; type-aware ESLint needs them.
[plugins.definitions.eslint.drivers.lint]
prepare_script = "npm ci"
